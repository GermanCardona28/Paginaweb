<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de una casa que se mantiene fresca con el viento, sin aire acondicionado">
  <rect width="400" height="225" fill="#CFEFDD"/>
  <circle cx="200" cy="112" r="104" fill="#BCE3CD"/>
  <circle cx="200" cy="112" r="78" fill="#C6E9D5"/>
  <!-- encuadre: todo el dibujo centrado en la misma caja -->
  <g transform="translate(200 112) scale(0.922) translate(-199 -115.5)">

  <!-- sol -->
  <g transform="translate(280,52)">
    <circle r="22" fill="#F2B544" opacity=".3"/>
    <circle r="15" fill="#F2B544"/>
  </g>

  <!-- casa -->
  <g transform="translate(196,128)">
    <ellipse cx="0" cy="66" rx="84" ry="7" fill="#08281A" opacity=".12"/>
    <rect x="-62" y="-6" width="124" height="70" rx="6" fill="#F5F8F3" stroke="#0A5C30" stroke-width="3"/>
    <path d="M-80 0 L0 -64 L80 0 Z" fill="#0A5C30"/>
    <path d="M-80 0 L0 -64 L80 0" fill="none" stroke="#08281A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-60 -6 L-6 -50" stroke="#F5F8F3" stroke-width="3" stroke-linecap="round" opacity=".25"/>
    <rect x="-14" y="20" width="28" height="44" rx="4" fill="#00873A"/>
    <circle cx="8" cy="44" r="2.5" fill="#F5F8F3"/>
    <g fill="#00873A">
      <circle cx="74" cy="56" r="12"/>
      <circle cx="88" cy="60" r="9" fill="#0A5C30"/>
      <circle cx="-76" cy="58" r="9" fill="#0A5C30"/>
    </g>
    <rect x="-48" y="12" width="24" height="22" rx="3" fill="#2E86AB" opacity=".85"/>
    <rect x="24" y="12" width="24" height="22" rx="3" fill="#2E86AB" opacity=".85"/>
    <line x1="-36" y1="12" x2="-36" y2="34" stroke="#F5F8F3" stroke-width="2"/>
    <line x1="36" y1="12" x2="36" y2="34" stroke="#F5F8F3" stroke-width="2"/>
  </g>

  <!-- viento fresco que atraviesa -->
  <g fill="none" stroke="#2E86AB" stroke-width="3.5" stroke-linecap="round">
    <path d="M70 118 H120 C132 118, 134 104, 124 102"/>
    <path d="M58 140 H122"/>
    <path d="M276 132 H330 C342 132, 344 146, 334 148"/>
    <path d="M282 154 H318"/>
  </g>

  <!-- acentos agrupados -->
  <g fill="#0A5C30">
    <circle cx="112" cy="62" r="4" opacity=".4"/>
    <circle cx="98" cy="80" r="2.5" opacity=".35"/>
    <circle cx="316" cy="96" r="3.5" opacity=".4"/>
  </g>
  <path d="M330 60 v10 M325 65 h10" stroke="#2E86AB" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
