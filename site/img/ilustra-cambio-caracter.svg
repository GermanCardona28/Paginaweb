<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de un diploma y un birrete, sobre el cambio de carácter a universitaria">
  <rect width="400" height="225" fill="#DCE6DF"/>
  <circle cx="200" cy="112" r="100" fill="#C7DED0"/>

  <!-- birrete, centrado arriba -->
  <g transform="translate(200,52)">
    <ellipse cx="0" cy="18" rx="8" ry="16" fill="#08281A"/>
    <path d="M-62 -4 L0 -24 L62 -4 L0 16 Z" fill="#08281A"/>
    <path d="M-62 -4 L0 16 L62 -4" fill="none" stroke="#0A5C30" stroke-width="2"/>
    <circle cx="0" cy="-4" r="5" fill="#00873A"/>
    <path d="M0 -4 C -20 6, -24 18, -20 30" fill="none" stroke="#00873A" stroke-width="2.5"/>
    <circle cx="-20" cy="31" r="4.5" fill="#00873A"/>
  </g>

  <!-- diploma, centrado debajo -->
  <g transform="translate(200,150)">
    <rect x="-78" y="-34" width="156" height="104" rx="10" fill="#F5F8F3" stroke="#0A5C30" stroke-width="3"/>
    <rect x="-56" y="-18" width="112" height="9" rx="4.5" fill="#0A5C30" opacity=".18"/>
    <line x1="-56" y1="4" x2="56" y2="4" stroke="#9FB3A8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-56" y1="18" x2="56" y2="18" stroke="#9FB3A8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-56" y1="32" x2="10" y2="32" stroke="#9FB3A8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="44" r="17" fill="#00873A"/>
    <path d="M40 44 l6 6 12 -14" stroke="#F5F8F3" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#0A5C30">
    <circle cx="60" cy="40" r="4" opacity=".4"/>
    <circle cx="44" cy="58" r="2.5" opacity=".35"/>
    <circle cx="340" cy="170" r="5" opacity=".4"/>
    <circle cx="356" cy="150" r="3" opacity=".35"/>
  </g>
</svg>
