<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de un concentrador solar que usa el calor del sol para obtener agua dulce">
  <rect width="400" height="225" fill="#CFEFDD"/>
  <circle cx="200" cy="112" r="104" fill="#BCE3CD"/>

  <!-- sol -->
  <g transform="translate(118,62)">
    <g stroke="#F2B544" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-36" x2="0" y2="-28"/>
      <line x1="0" y1="28" x2="0" y2="36"/>
      <line x1="-36" y1="0" x2="-28" y2="0"/>
      <line x1="28" y1="0" x2="36" y2="0"/>
      <line x1="-25" y1="-25" x2="-20" y2="-20"/>
      <line x1="20" y1="20" x2="25" y2="25"/>
      <line x1="-25" y1="25" x2="-20" y2="20"/>
      <line x1="20" y1="-20" x2="25" y2="-25"/>
    </g>
    <circle r="20" fill="#F2B544"/>
  </g>

  <!-- rayos que llegan al espejo y se juntan en el foco -->
  <g stroke="#F2B544" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" fill="none">
    <path d="M140 80 L168 150 L206 104"/>
    <path d="M150 72 L206 166 L206 104"/>
    <path d="M160 64 L244 150 L206 104"/>
  </g>

  <!-- concentrador -->
  <path d="M150 128 Q206 196 262 128" fill="none" stroke="#0A5C30" stroke-width="10" stroke-linecap="round"/>
  <path d="M158 132 Q206 186 254 132" fill="none" stroke="#F5F8F3" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <line x1="206" y1="166" x2="206" y2="200" stroke="#08281A" stroke-width="6" stroke-linecap="round"/>
  <rect x="180" y="198" width="52" height="10" rx="5" fill="#08281A"/>
  <line x1="206" y1="104" x2="206" y2="160" stroke="#08281A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="206" cy="104" r="9" fill="#F5F8F3" stroke="#08281A" stroke-width="3"/>

  <!-- agua dulce -->
  <g transform="translate(290,104)">
    <path d="M0 -40 C16 -18, 26 -4, 26 10 A26 26 0 0 1 -26 10 C-26 -4, -16 -18, 0 -40 Z" fill="#2E86AB"/>
    <path d="M-12 8 A13 13 0 0 0 0 22" fill="none" stroke="#F5F8F3" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- acentos agrupados -->
  <g fill="#0A5C30">
    <circle cx="96" cy="150" r="4" opacity=".4"/>
    <circle cx="110" cy="168" r="2.5" opacity=".35"/>
    <circle cx="310" cy="164" r="3.5" opacity=".4"/>
  </g>
</svg>
