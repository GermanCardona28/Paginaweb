    <circle r="60" fill="#F5F8F3" stroke="#00873A" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#2E86AB" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M-22 2 L-6 20 L26 -18" fill="none" stroke="#2E86AB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

