<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de un sobre de correo abierto, con una carta saliendo">
  <rect width="400" height="480" fill="#DCE6DF"/>
  <circle cx="200" cy="235" r="150" fill="#C7DED0"/>

  <g transform="translate(200,235)">
    <!-- carta -->
    <rect x="-80" y="-120" width="160" height="110" rx="10" fill="#F5F8F3" stroke="#0A5C30" stroke-width="3"/>
    <line x1="-54" y1="-88" x2="54" y2="-88" stroke="#9FB3A8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-54" y1="-66" x2="54" y2="-66" stroke="#9FB3A8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-54" y1="-44" x2="0" y2="-44" stroke="#9FB3A8" stroke-width="5" stroke-linecap="round"/>

    <!-- sobre -->
    <rect x="-80" y="0" width="160" height="100" rx="14" fill="#08281A"/>
    <path d="M-80 4 L0 70 L80 4 L80 14 L0 80 L-80 14 Z" fill="#0A5C30"/>

    <!-- sello -->
    <circle cx="0" cy="-4" r="26" fill="#2E86AB"/>
    <path d="M-12 -4 l8 8 16 -18" stroke="#F5F8F3" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#0A5C30">
      <circle cx="-104" cy="-90" r="4.5" opacity=".4"/>
      <circle cx="-118" cy="-70" r="3" opacity=".35"/>
      <circle cx="108" cy="-20" r="4.5" opacity=".4"/>
    </g>
  </g>
</svg>
