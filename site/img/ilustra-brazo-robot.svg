<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de un brazo robótico que llega a un punto exacto">
  <rect width="400" height="225" fill="#CFEFDD"/>
  <circle cx="200" cy="112" r="104" fill="#BCE3CD"/>
  <circle cx="200" cy="112" r="78" fill="#C6E9D5"/>
  <!-- encuadre: todo el dibujo centrado en la misma caja -->
  <g transform="translate(200 112) scale(0.971) translate(-208.5 -125.5)">

  <!-- piso -->
  <ellipse cx="160" cy="204" rx="70" ry="7" fill="#08281A" opacity=".12"/>

  <!-- punto exacto al que llega el brazo -->
  <g transform="translate(284,166)">
    <ellipse cx="0" cy="26" rx="22" ry="4" fill="#08281A" opacity=".1"/>
    <circle r="22" fill="#F5F8F3" opacity=".75"/>
    <circle r="22" fill="none" stroke="#2E86AB" stroke-width="2" stroke-dasharray="3 6"/>
    <circle r="12" fill="none" stroke="#2E86AB" stroke-width="1.5" opacity=".5"/>
    <path d="M-30 0 H-14 M14 0 H30 M0 -30 V-14 M0 14 V30" stroke="#2E86AB" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="5.5" fill="#2E86AB"/>
    <circle cx="-1.5" cy="-1.5" r="1.8" fill="#F5F8F3" opacity=".8"/>
  </g>

  <!-- recorrido calculado -->
  <path d="M120 70 C150 34, 236 26, 270 70" fill="none" stroke="#2E86AB" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round" opacity=".7"/>
  <path d="M264 62 L271 72 L278 61" fill="none" stroke="#2E86AB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

  <!-- base -->
  <rect x="112" y="190" width="76" height="14" rx="7" fill="#08281A"/>
  <path d="M124 190 a26 26 0 0 1 52 0 Z" fill="#0A5C30"/>
  <path d="M132 186 a18 18 0 0 1 14 -16" fill="none" stroke="#F5F8F3" stroke-width="3" stroke-linecap="round" opacity=".3"/>

  <!-- brazo -->
  <g stroke-linecap="round" fill="none">
    <line x1="150" y1="168" x2="198" y2="96" stroke="#0A5C30" stroke-width="22"/>
    <line x1="146" y1="160" x2="186" y2="100" stroke="#F5F8F3" stroke-width="3" opacity=".25"/>
    <line x1="198" y1="96" x2="262" y2="114" stroke="#00873A" stroke-width="17"/>
    <line x1="206" y1="92" x2="252" y2="105" stroke="#F5F8F3" stroke-width="2.5" opacity=".3"/>
    <line x1="262" y1="114" x2="276" y2="136" stroke="#08281A" stroke-width="12"/>
    <path d="M268 140 L264 152 M284 136 L292 146" stroke="#08281A" stroke-width="6"/>
  </g>

  <!-- articulaciones -->
  <g fill="#F5F8F3" stroke="#08281A" stroke-width="3">
    <circle cx="150" cy="168" r="11"/>
    <circle cx="198" cy="96" r="10"/>
    <circle cx="262" cy="114" r="8"/>
  </g>
  <g fill="#2E86AB">
    <circle cx="150" cy="168" r="3.5"/>
    <circle cx="198" cy="96" r="3"/>
    <circle cx="262" cy="114" r="2.5"/>
  </g>

  <!-- acentos agrupados -->
  <g fill="#0A5C30">
    <circle cx="104" cy="96" r="4" opacity=".4"/>
    <circle cx="92" cy="114" r="2.5" opacity=".35"/>
    <circle cx="306" cy="58" r="3.5" opacity=".4"/>
  </g>
  <path d="M322 104 v10 M317 109 h10" stroke="#2E86AB" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
