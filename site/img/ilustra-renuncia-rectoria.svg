<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de una puerta institucional que se abre hacia un camino">
  <rect width="400" height="225" fill="#DCE6DF"/>
  <circle cx="345" cy="40" r="70" fill="#C7DED0"/>
  <circle cx="20" cy="195" r="55" fill="#C7DED0"/>

  <!-- horizonte -->
  <rect x="0" y="178" width="400" height="47" fill="#BCE3CD"/>
  <circle cx="300" cy="150" r="34" fill="#F5F8F3" opacity=".8"/>

  <!-- camino -->
  <path d="M170 225 L205 130 L225 130 L270 225 Z" fill="#F5F8F3" opacity=".7"/>
  <line x1="205" y1="178" x2="195" y2="225" stroke="#BCE3CD" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="225" y1="178" x2="245" y2="225" stroke="#BCE3CD" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- edificio institucional -->
  <g transform="translate(60,54)">
    <rect x="0" y="20" width="150" height="100" fill="#08281A"/>
    <path d="M-8 20 L75 -8 L158 20 Z" fill="#0A5C30"/>
    <rect x="18" y="38" width="14" height="82" fill="#DCE6DF"/>
    <rect x="40" y="38" width="14" height="82" fill="#DCE6DF"/>
    <rect x="96" y="38" width="14" height="82" fill="#DCE6DF"/>
    <rect x="118" y="38" width="14" height="82" fill="#DCE6DF"/>
    <!-- puerta abierta -->
    <path d="M60 120 L60 48 L86 42 L86 120 Z" fill="#F5F8F3"/>
    <path d="M86 42 L86 120 L112 128 L112 52 Z" fill="#00873A" opacity=".85"/>
  </g>

  <g fill="#0A5C30">
    <circle cx="332" cy="128" r="4" opacity=".5"/>
    <circle cx="350" cy="110" r="3" opacity=".4"/>
    <circle cx="50" cy="40" r="3.5" opacity=".4"/>
  </g>
</svg>
